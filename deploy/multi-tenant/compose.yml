include:
  - path: ../third-party.yml
    env_file:
      - .env

services:
  postgres:
    environment:
      TENANCY_MODE: multi
  rabbitmq:
    environment:
      TENANCY_MODE: multi
  rustfs:
    environment:
      TENANCY_MODE: multi

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  rabbitmq_conf:
    file: ./secrets/rabbitmq.conf
  rustfs_access_key:
    file: ./secrets/rustfs_access_key
  rustfs_secret_key:
    file: ./secrets/rustfs_secret_key
