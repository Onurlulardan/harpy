# Unit job does not start Postgres, RabbitMQ, or RustFS.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Test
        run: go test ./...

  fileguard:
    name: fileguard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: fileguard
        run: go run ./tools/fileguard

  archguard:
    name: archguard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: archguard
        run: go run ./tools/archguard
