# Unit job does not start Postgres, RabbitMQ, or RustFS.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Currency registry drift
        run: |
          go run ./tools/currencyregistry
          git diff --exit-code -- contracts/generated.yaml
      - name: Goose migration immutability
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch --depth=1 origin "${{ github.base_ref }}"
            go run ./tools/gooseimmutable "origin/${{ github.base_ref }}"
          else
            go run ./tools/gooseimmutable HEAD
          fi


  integration-compile:
    name: integration compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - name: Compile integration-tagged tests
        run: go test -tags=integration -count=0 -run '^$' ./...

  foundation-pg18:
    name: foundation PostgreSQL 18
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.3-pg18-bookworm@sha256:c8a919765f2ef63681329fa21021b830cd4d79d1165bdca730dd016014e4da84
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: harpy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d harpy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      HARPY_FOUNDATION_TEST_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/harpy_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - name: Test foundation, goose, and initialize on PostgreSQL 18
        run: go test -tags=integration -count=1 -timeout 20m ./core/internal/platform/foundation ./core/internal/platform/goose ./core/internal/platform/initialize

  fileguard:
    name: fileguard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - name: fileguard
        run: go run ./tools/fileguard

  archguard:
    name: archguard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - name: archguard
        run: go run ./tools/archguard
